global:
  scrape_interval: 10s
scrape_configs:
  - job_name: api
    static_configs: [{targets: ['api:8000']}]
  - job_name: verifier
    static_configs: [{targets: ['verifier:8001']}]
  - job_name: stub
    static_configs: [{targets: ['provider-stub:8002']}]
  - job_name: workers
    fallback_scrape_protocol: PrometheusText0.0.4
    dns_sd_configs: [{names: ['classifier-worker'], type: A, port: 9100}]
  - job_name: redis
    static_configs: [{targets: ['redis-exporter:9121']}]
  - job_name: containers
    static_configs: [{targets: ['cadvisor:8080']}]
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: jaeger
    static_configs: [{targets: ['jaeger:14269']}]
  - job_name: grafana
    static_configs: [{targets: ['grafana:3000']}]
